<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | ModoFrame</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />

  <link rel="stylesheet" href="styles.css" />

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #111;
      color: white;
    }

    

    /* =========================
       TOP CATEGORY BUTTONS
    ========================== */

    .btn-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    .nav-btn {
      width: auto;
      min-width: 120px;
      border: 0;
      border-radius: 8px;
      padding: 11px 24px;
      background: #242424;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: #ff4964;
      transform: translateY(-2px);
    }

    /* =========================
       MARQUEE PHOTO CAROUSEL
    ========================== */

    .marquee-section {
      overflow: hidden;
      padding: 20px 0 30px;
    }

    .marquee-container {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .marquee-track {
      display: flex;
      width: max-content;
      gap: 18px;
      animation: marquee-scroll 28s linear infinite;
      padding-left: 18px;
    }

    .marquee-container:hover .marquee-track {
      animation-play-state: paused;
    }

    .marquee-item {
      width: 390px;
      height: 480px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #222;
    }

    .marquee-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .marquee-item:hover img {
      transform: scale(1.04);
    }

    .featured-label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 2;
      padding: 7px 13px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
    }

    @keyframes marquee-scroll {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(calc(-50% - 9px));
      }
    }

    /* =========================
       SECTION STYLING
    ========================== */

    .section {
      padding-top: 10px;
    }

    .section h2 {
      text-align: center;
      margin: 20px 0 5px;
    }

    .section-subtitle {
      text-align: center;
      margin: 0 auto 15px;
      padding: 0 20px;
      color: #bdbdbd;
      font-size: 14px;
    }

    /* =========================
       PHOTO GALLERY
    ========================== */

    .carousel-grid {
      column-count: 4;
      column-gap: 15px;
      padding: 20px;
    }

    .carousel-grid img {
      width: 100%;
      display: block;
      margin-bottom: 15px;
      border-radius: 10px;
      break-inside: avoid;
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }

    .carousel-grid img:hover {
      transform: scale(1.03);
    }

    /* =========================
       VIDEO GRIDS
    ========================== */

    .video-grid {
      display: grid;
      gap: 20px;
      padding: 20px;
    }

    .featured-video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      padding: 20px;
    }

    #shorts-container {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    #youtube-container {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
      cursor: pointer;
    }

    .video-wrapper.short-video {
      aspect-ratio: 9 / 16;
      max-width: 340px;
      width: 100%;
      justify-self: center;
    }

    .video-wrapper.long-video {
      width: 100% !important;
      max-width: none !important;
      height: auto !important;
      min-height: 0 !important;
      aspect-ratio: 16 / 9 !important;
      padding: 0 !important;
      padding-bottom: 0 !important;
      justify-self: stretch !important;
    }

    .video-wrapper.long-video .thumbnail,
    .video-wrapper.long-video .embedded-iframe {
      position: static !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .video-wrapper .thumbnail,
    .video-wrapper .embedded-iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }

    .video-wrapper .thumbnail {
      object-fit: cover;
    }

    .play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 68px;
      height: 48px;
      transform: translate(-50%, -50%);
      border-radius: 12px;
      background: rgba(255, 0, 0, 0.9);
      pointer-events: none;
    }

    .play-button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 52%;
      transform: translate(-50%, -50%);
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 16px solid white;
    }

    /* =========================
       EXPANDED CONTENT SECTIONS
    ========================== */

    .expandable-section {
      display: none;
      scroll-margin-top: 30px;
      animation: reveal-section 0.35s ease;
    }

    .expandable-section.active {
      display: block;
    }

    @keyframes reveal-section {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       LIGHTBOX
    ========================== */

    .lightbox {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.88);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      display: none;
      cursor: pointer;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 10px;
      object-fit: contain;
    }

    .lightbox.active {
      display: flex;
    }

    /* =========================
       RESPONSIVE DESIGN
    ========================== */

    @media (max-width: 1200px) {
      .marquee-item {
        width: 330px;
        height: 420px;
      }

      .carousel-grid {
        column-count: 3;
      }

      #shorts-container {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      #youtube-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .marquee-item {
        width: 290px;
        height: 380px;
      }

      .featured-video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .carousel-grid {
        column-count: 2;
      }

      #shorts-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #youtube-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .btn-nav {
        gap: 8px;
        padding: 15px 10px;
      }

      .nav-btn {
        min-width: 95px;
        padding: 9px 14px;
        font-size: 14px;
      }

      .marquee-track {
        gap: 12px;
        padding-left: 12px;
        animation-duration: 22s;
      }

      .marquee-item {
        width: 250px;
        height: 330px;
      }

      .featured-video-grid {
        grid-template-columns: 1fr;
        padding: 10px;
        gap: 15px;
      }

      .carousel-grid {
        column-count: 2;
        column-gap: 10px;
        padding: 10px;
      }

      .carousel-grid img {
        margin-bottom: 10px;
      }

      .video-grid {
        padding: 10px;
        gap: 12px;
      }

      #shorts-container {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #youtube-container {
        grid-template-columns: 1fr;
      }

      .play-button {
        width: 56px;
        height: 40px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img
        src="images/pinklogo.png"
        alt="ModoFrame Logo"
        class="modoframe-logo"
      />
      <span class="logo-text">ModoFrame</span>
    </div>

    <nav>
      <a href="index.html">About</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <!-- Top Filter Buttons -->
  <div class="btn-nav">
    <button class="nav-btn" data-target="photos-section">Photos</button>
    <button class="nav-btn" data-target="shorts-section">Shorts</button>
    <button class="nav-btn" data-target="youtube-section">YouTube</button>
  </div>

  <!-- Featured Marquee Photos -->
  <section class="section marquee-section">
    <h2>Featured</h2>
    <p class="section-subtitle">
    
    </p>

    <div class="marquee-container">
      <div id="marquee-track" class="marquee-track"></div>
    </div>
  </section>

  <!-- Featured Shorts -->
  <section class="section">
    <h2>Shorts</h2>
    <div class="featured-video-grid" id="featured-shorts-container"></div>
  </section>

  <!-- Featured Long Videos -->
  <section class="section">
    <h2>YouTube Videos</h2>
    <div class="featured-video-grid" id="featured-youtube-container"></div>
  </section>

  <!-- Remaining Photos -->
  <section class="section expandable-section" id="photos-section">
    <h2>Photography</h2>
    <div id="carousel-container" class="carousel-grid"></div>
  </section>

  <!-- Remaining Shorts -->
  <section class="section expandable-section" id="shorts-section">
    <h2>All Shorts</h2>
    <div class="video-grid" id="shorts-container"></div>
  </section>

  <!-- Remaining Long YouTube Videos -->
  <section class="section expandable-section" id="youtube-section">
    <h2>All YouTube Videos</h2>
    <div class="video-grid" id="youtube-container"></div>
  </section>

  <!-- Lightbox Viewer -->
  <div class="lightbox" id="lightbox">
    <img src="" alt="Full Size" id="lightbox-img" />
  </div>

  <script>
    /*
      FEATURED MARQUEE PHOTO SETTINGS

      Change these six numbers whenever you want
      to replace the featured carousel photos.
    */
    const marqueeImageNumbers = [103, 11, 104, 35, 52, 110];

    /*
      Total number of photos available.
    */
    const totalImages = 115;

    /*
      Number of shuffled photos shown after clicking Photos.
    */
    const imagesToShow = 40;

    const imageFolder = 'portfolio/photos/';
    const imageFormat = 'jpg';

    const imageNames = Array.from(
      { length: totalImages },
      (_, i) => `${i + 1}.${imageFormat}`
    );

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }

    /*
      Creates the continuously moving photo carousel.

      The image list is duplicated so the animation loops smoothly.
    */
    function createMarqueeGallery(imageNumbers) {
      const track = document.getElementById('marquee-track');
      const repeatedImages = [...imageNumbers, ...imageNumbers];

      repeatedImages.forEach((imageNumber, index) => {
        if (imageNumber < 1 || imageNumber > totalImages) {
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'marquee-item';

        const img = document.createElement('img');
        img.src = `${imageFolder}${imageNumber}.${imageFormat}`;
        img.alt = `Featured portfolio image ${imageNumber}`;
        img.loading = index < 6 ? 'eager' : 'lazy';

        img.onerror = () => {
          wrapper.remove();
        };

        img.onclick = () => {
          openLightbox(img.src);
        };

        const label = document.createElement('div');
        label.className = 'featured-label';
        label.innerHTML = '<i class="fas fa-star"></i> Featured';

        wrapper.appendChild(img);
        wrapper.appendChild(label);
        track.appendChild(wrapper);
      });
    }

    /*
      Creates the shuffled gallery shown after clicking Photos.
    */
    function createGallery(images) {
      const container = document.getElementById('carousel-container');

      images.forEach(imgName => {
        const img = document.createElement('img');

        img.src = `${imageFolder}${imgName}`;
        img.alt = `Portfolio image ${imgName}`;
        img.loading = 'lazy';

        img.onerror = () => {
          img.remove();
        };

        img.onclick = () => {
          openLightbox(img.src);
        };

        container.appendChild(img);
      });
    }

    function openLightbox(src) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');

      lightboxImg.src = src;
      lightbox.classList.add('active');
    }

    document.getElementById('lightbox').onclick = function () {
      this.classList.remove('active');
    };

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('active');
      }
    });

    createMarqueeGallery(marqueeImageNumbers);

    /*
      The full Photography section uses the original behaviour:
      40 photos are randomly selected and shuffled from all 115 images.
    */
    createGallery(
      shuffle([...imageNames]).slice(0, imagesToShow)
    );

    /*
      ALL SHORTS LINKS
    */
    const allShorts = [
      'https://youtu.be/cJI8ufeUuVY',
      'https://youtu.be/sMEbipe8m0o',
      'https://youtu.be/kChfzoF0tB4',
      'https://youtu.be/GwCnpzade58',
      'https://youtu.be/FcDLEEc2qv4',
      'https://youtu.be/mv7wDpLtidM',
      'https://youtu.be/tb34xMsddyA',
      'https://youtu.be/PM4blu1eDos',
      'https://youtu.be/M0nZ5Zxj_4Q',
      'https://youtu.be/ivoUvm579SE',
      'https://youtu.be/biBjxzPmqoE',
      'https://youtu.be/yoNFAojJ5OQ',
      'https://youtu.be/gSviG6tqEBk',
      'https://youtu.be/EtqYQheMbzY'
    ];

    /*
      ALL LONG YOUTUBE VIDEO LINKS
    */
    const allYouTubeVideos = [
      'https://youtu.be/uwlYdGivFJg?si=ql1HbSv6jkufRRU0',
      'https://youtu.be/Cbk_scjX3oo?si=NA6oSRn0mX58HCSd',
      'https://youtu.be/JHETotLUx3E?si=cBC4PQyxzjBR-0i_',
      'https://youtu.be/Y7Z2kYaiI40?si=ZorO-WounzU6NxoH',
      'https://youtu.be/1iSc4g7WrC4',
      'https://youtu.be/u54MY3jU0kY',
      'https://youtu.be/9Wc-H8ePWP4'
    ];

    /*
      The first three items appear in the featured area.

      The complete Shorts and YouTube arrays are also displayed
      in their full sections after the relevant top button is clicked.
    */
    const featuredShorts = allShorts.slice(0, 3);
    const featuredYouTubeVideos = allYouTubeVideos.slice(0, 3);

    function getYouTubeVideoId(url) {
      try {
        const parsedUrl = new URL(url);

        if (parsedUrl.hostname.includes('youtu.be')) {
          return parsedUrl.pathname.replace('/', '');
        }

        if (parsedUrl.hostname.includes('youtube.com')) {
          if (parsedUrl.pathname.includes('/shorts/')) {
            return parsedUrl.pathname.split('/shorts/')[1].split('/')[0];
          }

          if (parsedUrl.pathname.includes('/embed/')) {
            return parsedUrl.pathname.split('/embed/')[1].split('/')[0];
          }

          return parsedUrl.searchParams.get('v');
        }
      } catch (error) {
        console.error('Invalid YouTube URL:', url);
      }

      return null;
    }

    function createYouTubeEmbed(url, videoType = 'long') {
      const videoId = getYouTubeVideoId(url);

      if (!videoId) {
        console.warn(`Could not find video ID for ${url}`);
        return null;
      }

      const container = document.createElement('div');

      container.className =
        videoType === 'short'
          ? 'video-wrapper short-video'
          : 'video-wrapper long-video';

      const thumbnail = document.createElement('img');
      thumbnail.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      thumbnail.alt =
        videoType === 'short'
          ? 'YouTube Short Thumbnail'
          : 'YouTube Video Thumbnail';
      thumbnail.className = 'thumbnail';
      thumbnail.loading = 'lazy';

      const playBtn = document.createElement('div');
      playBtn.className = 'play-button';

      container.onclick = () => {
        const iframe = document.createElement('iframe');

        iframe.src =
          `https://www.youtube.com/embed/${videoId}` +
          '?autoplay=1&rel=0&modestbranding=1';

        iframe.title =
          videoType === 'short'
            ? 'YouTube Short'
            : 'YouTube Video';

        iframe.allow =
          'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';

        iframe.allowFullscreen = true;
        iframe.className = 'embedded-iframe';

        container.innerHTML = '';
        container.appendChild(iframe);
      };

      container.appendChild(thumbnail);
      container.appendChild(playBtn);

      return container;
    }

    function addVideosToContainer(urls, containerId, videoType) {
      const container = document.getElementById(containerId);

      urls.forEach(url => {
        const videoElement = createYouTubeEmbed(url, videoType);

        if (videoElement) {
          container.appendChild(videoElement);
        }
      });
    }

    addVideosToContainer(
      featuredShorts,
      'featured-shorts-container',
      'short'
    );

    addVideosToContainer(
      featuredYouTubeVideos,
      'featured-youtube-container',
      'long'
    );

    addVideosToContainer(
      allShorts,
      'shorts-container',
      'short'
    );

    addVideosToContainer(
      allYouTubeVideos,
      'youtube-container',
      'long'
    );

    /*
      Navigation button behaviour.

      Clicking Photos, Shorts, or YouTube:
      1. Keeps all featured content at the top unchanged.
      2. Hides any previously opened full category section.
      3. Opens the selected full category below the featured content.
      4. Scrolls smoothly to that section.
    */
    const navButtons = document.querySelectorAll('.nav-btn');
    const expandableSections =
      document.querySelectorAll('.expandable-section');

    navButtons.forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.dataset.target;
        const targetSection = document.getElementById(targetId);
        const isAlreadyOpen = targetSection.classList.contains('active');

        expandableSections.forEach(section => {
          section.classList.remove('active');
        });

        navButtons.forEach(navButton => {
          navButton.classList.remove('active');
        });

        if (!isAlreadyOpen) {
          targetSection.classList.add('active');
          button.classList.add('active');

          requestAnimationFrame(() => {
            targetSection.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          });
        }
      });
    });
  </script>
</body>
</html>
